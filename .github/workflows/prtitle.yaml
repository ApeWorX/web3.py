name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: astral-sh/setup-uv@v7

    - name: Check PR Title
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: uvx commitlint "$PR_TITLE"
