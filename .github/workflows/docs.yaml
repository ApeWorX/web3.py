on: ["push", "pull_request"]

name: Docs

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"
    - name: Build Docs
      run: uv run --group docs sphinx-apidoc -o docs/ . "*conftest*" "tests" "scripts" "web3/tools/*"
    - name: Run HTML Docs
      run: uv run --group docs sphinx-build -W -b html docs docs/_build/html
    - name: Run Doctests
      run: uv run --group docs sphinx-build -W -b doctest docs docs/_build/doctest
    - name: Run EPUB Docs
      run: uv run --group docs sphinx-build -W -b epub docs docs/_build/epub
