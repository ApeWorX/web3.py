name: Compatibility

on:
  workflow_dispatch:
  schedule:
    # Weekdays 12:00 UTC.
    - cron: "0 12 * * 1-5"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  ensip15-specs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Verify ENSIP-15 specifications
      run: |
        python - <<'PY'
        import json
        from urllib.request import urlopen

        base = "https://raw.githubusercontent.com/adraffy/ens-normalize.js/main"
        specs = {
            "ens/specs/normalization_spec.json": f"{base}/derive/output/spec.json",
            "ens/specs/nf.json": f"{base}/derive/output/nf.json",
            "tests/ens/normalization/normalization_tests.json": (
                f"{base}/validate/tests.json"
            ),
        }
        for local_path, upstream_url in specs.items():
            with open(local_path) as local_file:
                local = json.load(local_file)
            with urlopen(upstream_url, timeout=30) as response:
                upstream = json.load(response)
            assert local == upstream, f"{local_path} differs from {upstream_url}"
        PY

  prerelease-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"
    - name: Run Compatibility Tests
      run: |
        uv run --group integration --prerelease allow \
          --upgrade-package eth-abi \
          --upgrade-package eth-account \
          --upgrade-package eth-hash \
          --upgrade-package eth-typing \
          --upgrade-package eth-utils \
          --upgrade-package hexbytes \
          --upgrade-package eth-tester \
          --upgrade-package py-geth \
          pytest tests/core -m "not asyncio" -n auto --maxprocesses=15
        uv run --group integration --prerelease allow \
          --upgrade-package eth-abi \
          --upgrade-package eth-account \
          --upgrade-package eth-hash \
          --upgrade-package eth-typing \
          --upgrade-package eth-utils \
          --upgrade-package hexbytes \
          --upgrade-package eth-tester \
          --upgrade-package py-geth \
          pytest tests/integration/test_ethereum_tester.py -n auto --maxprocesses=15
