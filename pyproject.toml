[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "web3"
dynamic = ["version"]
description = "web3: A Python library for interacting with Ethereum"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    { name = "The Ethereum Foundation", email = "snakecharmers@ethereum.org" },
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
maintainers = [
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.7.4.post0",
    "eth-abi>=6",
    "eth-account>=0.14",
    "eth-hash[pycryptodome]>=0.5.1",
    "eth-typing>=5.0.0",
    "eth-utils>=5.3.0",
    "hexbytes>=2",
    "pydantic>=2.4",
    "pyunormalize>=15",
    "pywin32>=223; platform_system == 'Windows'",
    "requests>=2.23.0",
    "typing-extensions>=4.0.1; python_version < '3.11'",
    "websockets>=14",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/web3.py"
Repository = "https://github.com/ApeWorX/web3.py.git"
Issues = "https://github.com/ApeWorX/web3.py/issues"
Documentation = "https://web3py.readthedocs.io/"
Funding = "https://github.com/sponsors/ApeWorX"

[project.optional-dependencies]
tester = [
    "eth-tester[py-evm]>=0.14.0b1,<0.15.0b1",
]
[dependency-groups]
test = [
    {include-group = "tester"},
    "cached-property>=2.0.1",
    "flaky>=3.7.0",
    "hypothesis>=3.31.2",
    "pytest>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=1.10",
    "pytest-xdist>=2.4.0",
]
tester = [
    "eth-tester[py-evm]>=0.14.0b1,<0.15.0b1",
]
integration = [
    {include-group = "test"},
    "py-geth>=7.0.1",
]
lint = [
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
    "mypy>=2.3.0",
    "ruff>=0.12.0",
    "types-requests>=2.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx_rtd_theme>=1.0.0",
]
maintenance = [
    "py-solc-x",
    "ruff>=0.12.0",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "ipython",
    "prek",
    "tqdm>4.32",
]

[tool.setuptools.packages.find]
exclude = ["scripts", "scripts.*", "tests", "tests.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
ens = ["specs/*.json"]
web3 = [
    "py.typed",
    "_utils/contract_sources/*.sol",
]

[tool.setuptools_scm]
fallback_version = "8.0.0b3"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
ignore_missing_imports = true
python_version = "3.10"
strict_equality = true
strict_optional = false
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "sphinx.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
asyncio_mode = "strict"
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "D2",
    "D3",
    "D4",
]
ignore = [
    "B018",
    "B008",
    "B904",
    "B905",
    "D200",
    "D203",
    "D204",
    "D205",
    "D212",
    "D400",
    "D401",
    "D412",
    "D415",
    "E501",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"ens/abis.py" = ["F401", "F403"]
"ens/contract_data.py" = ["F401", "F403"]
"docs/conf.py" = ["E402", "E501"]
"web3/main.py" = ["I001"]
"web3/_utils/windows.py" = ["I001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["pytest"]
force-sort-within-sections = true
force-to-top = ["pytest"]
known-first-party = ["web3", "ens"]
known-third-party = ["hypothesis"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mdformat]
number = true
